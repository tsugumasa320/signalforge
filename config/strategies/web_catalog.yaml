  collection:
    honest_status: '初版は証券会社・ブログ・Web検索による手動 curation が中心。

      2026-03-23: media_sources.yaml（証券・株探/みんかぶ・金融メディア・Qiita/Zenn・Reddit・5chアーカイブ・海外TA等）を

      collect_strategy_mentions.py が順次 GET しキーワード集計 → data/strategy_harvest/mentions.json。

      未取得: X/Twitter 本家検索、5ch 本家、Discord/LINE、Podcast 音声、TDnet/適時開示のイベント駆動、Amazon
      等の動的ページは限定的。

      YouTube は --youtube + youtube-transcript-api で video_id のみ字幕取得。

      '
    harvest_script: scripts/collect_strategy_mentions.py
    seeds: config/strategies/collection_seeds.yaml
    media_registry: config/strategies/media_sources.yaml
