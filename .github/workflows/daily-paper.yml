name: Daily paper update

on:
  schedule:
    # 毎日 22:00 UTC ≒ JST 07:00（米国大引け後・日本の朝）
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-paper
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore OHLCV cache (optional speedup)
        uses: actions/cache@v4
        with:
          path: data
          key: ohlcv-${{ runner.os }}-${{ hashFiles('data/*.pkl') }}
          restore-keys: |
            ohlcv-${{ runner.os }}-

      - name: Fetch data & run paper
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: bash scripts/ci-daily-paper.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit paper state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper/
          if git diff --staged --quiet; then
            echo "No paper state changes."
          else
            git commit -m "chore(paper): daily update (run ${GITHUB_RUN_ID})"
            git push
          fi
